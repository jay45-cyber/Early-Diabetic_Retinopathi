evaluation:
  metrics:
    - auroc
    - auprc
    - sensitivity
    - specificity
    - precision
    - negative_predictive_value
    - f1_score
    - brier_score
    - confusion_matrix
    - calibration_curve

  confidence_intervals:
    method: "bootstrap_patient_level" # Resamples participants, not single images
    n_bootstraps: 1000
    confidence_level: 0.95

  subgroups:
    - "dr_grade == 0" # Primary research question: no visible diabetic retinopathy
    - "sex == 'Female'"
    - "sex == 'Male'"
    - "age_group"
    - "camera_model"

  calibration:
    method: "platt_scaling" # Isotonic or Platt scaling on validation partition
    bins: 10

